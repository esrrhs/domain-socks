name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  binaries:
    name: Cross-compile & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # Same script maintainers run locally, so release artifacts and
      # hand-built router binaries cannot drift in flags/ABI:
      # mipsle soft-float (Newifi3/MT7621), mips BE, arm64 (Filogic),
      # armv7, amd64, plus Windows for desktop testing.
      - name: Build all targets
        run: |
          ./build-openwrt.sh linux/mipsle linux/mips linux/arm64 linux/arm linux/amd64 windows/amd64
          # Windows binaries expect the .exe suffix for the release page
          mv domain-socks-windows-amd64 domain-socks-windows-amd64.exe
          sha256sum domain-socks-* > checksums.txt
          cat checksums.txt

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            domain-socks-* checksums.txt
