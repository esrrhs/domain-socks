name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Test build (Linux)
        run: GOOS=linux GOARCH=amd64 go build -v .

      - name: Cross build (OpenWrt targets, same script as local builds)
        run: ./build-openwrt.sh linux/mipsle linux/mips linux/arm64 linux/arm
